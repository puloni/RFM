name: Extract Antigravity Project

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "Real Football Manager.zip" ]; then
            echo "No source ZIP remains. Nothing to extract."
            exit 0
          fi

          rm -rf /tmp/rfm-extract
          mkdir -p /tmp/rfm-extract
          unzip -q "Real Football Manager.zip" -d /tmp/rfm-extract

          shopt -s dotglob nullglob
          entries=(/tmp/rfm-extract/*)

          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
            src="${entries[0]}"
          else
            src="/tmp/rfm-extract"
          fi

          cp -a "${src}/." .

          # GitHub's token cannot push newly extracted workflow files.
          # Keep the extraction workflow itself, but do not commit project workflows.
          rm -f .github/workflows/build-apk.yml
          rm -f .github/workflows/.trigger .github/workflows/.trigger2

          rm -rf .pocketdev .kotlin
          find . -type f -name "*.zip" -delete
          rm -f "Real Football Manager.zip"

      - name: Commit extracted project
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Extract Real Football Manager Android project"
          git push
